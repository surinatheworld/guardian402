[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[invariant]
runs = 256
depth = 64

[rpc_endpoints]
fuji = "${FUJI_RPC_URL}"
local = "http://127.0.0.1:8545"

[lint]
# Inherent to SPEC §4.3, reviewed and accepted: per-call checks revert inside the batch loop, balances are
# read per tracked token, and daily caps and verdict deadlines are defined on block.timestamp.
exclude_lints = ["require-revert-in-loop", "calls-loop", "block-timestamp"]
