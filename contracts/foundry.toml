[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[invariant]
runs = 256
depth = 64

[rpc_endpoints]
fuji = "${FUJI_RPC_URL}"
local = "http://127.0.0.1:8545"
