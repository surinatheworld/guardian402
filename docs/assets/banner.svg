<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Guardian402: transaction firewall for AI agent wallets on Avalanche">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.55" stop-color="#0b1326"/>
      <stop offset="1" stop-color="#1a0b12"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.22" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#2f7bff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2f7bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="0.9" cy="0.85" r="0.55">
      <stop offset="0" stop-color="#e84142" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e84142" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa2ff"/>
      <stop offset="1" stop-color="#1f5fe0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe0ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glowBlue)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glowRed)"/>

  <!-- shield -->
  <g transform="translate(96 92)">
    <path d="M88 0 168 30v62c0 52-34 88-80 104C42 180 8 144 8 92V30Z" fill="url(#shield)"/>
    <path d="M88 0 168 30v62c0 52-34 88-80 104Z" fill="#ffffff" fill-opacity="0.12"/>
    <path d="M52 98l26 26 42-52" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- title -->
  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <text x="312" y="150" font-size="76" font-weight="700" letter-spacing="-2" fill="url(#title)">guardian<tspan fill="#4c97ff">402</tspan></text>
    <text x="316" y="200" font-size="27" font-weight="500" fill="#dbe6ff">Transaction firewall &amp; co-signer for AI-agent wallets</text>
    <text x="316" y="236" font-size="19" fill="#93a4c7">Simulate · score · explain · sign — before the agent's money moves</text>

    <!-- pills -->
    <g font-size="16" font-weight="600">
      <g transform="translate(316 268)">
        <rect width="178" height="38" rx="19" fill="#e84142" fill-opacity="0.18" stroke="#e84142" stroke-opacity="0.7"/>
        <text x="89" y="25" text-anchor="middle" fill="#ff8f90">Avalanche Fuji</text>
      </g>
      <g transform="translate(508 268)">
        <rect width="168" height="38" rx="19" fill="#4c97ff" fill-opacity="0.16" stroke="#4c97ff" stroke-opacity="0.7"/>
        <text x="84" y="25" text-anchor="middle" fill="#9cc4ff">x402 payments</text>
      </g>
      <g transform="translate(690 268)">
        <rect width="170" height="38" rx="19" fill="#22c55e" fill-opacity="0.14" stroke="#22c55e" stroke-opacity="0.7"/>
        <text x="85" y="25" text-anchor="middle" fill="#86efac">EIP-712 verdicts</text>
      </g>
      <g transform="translate(874 268)">
        <rect width="156" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.35"/>
        <text x="78" y="25" text-anchor="middle" fill="#e5e7eb">Non-custodial</text>
      </g>
    </g>
  </g>

  <!-- verdict chips on the right -->
  <g font-family="'JetBrains Mono', Consolas, Menlo, monospace" font-size="15" font-weight="600">
    <g transform="translate(1016 70)">
      <rect width="208" height="40" rx="10" fill="#22c55e" fill-opacity="0.13" stroke="#22c55e" stroke-opacity="0.55"/>
      <text x="16" y="26" fill="#86efac">LOW   → executed</text>
    </g>
    <g transform="translate(1046 124)">
      <rect width="178" height="40" rx="10" fill="#e84142" fill-opacity="0.15" stroke="#e84142" stroke-opacity="0.6"/>
      <text x="16" y="26" fill="#ff9b9c">HIGH  → revert</text>
    </g>
    <g transform="translate(1076 178)">
      <rect width="148" height="40" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="16" y="26" fill="#cbd5e1">kill switch</text>
    </g>
  </g>
</svg>
